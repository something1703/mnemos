<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mnemos">
  <title>Mnemos</title>
  <!-- An M built from three linked nodes: an engram.
       The right leg fades to a dashed terminus — forgetting is part of memory,
       not a failure of it. That dash is the whole product in one stroke. -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 51 V21" />
    <path d="M12 21 L32 43" />
    <path d="M32 43 L52 21" />
    <path d="M52 21 V37" />
    <path d="M52 43 V51" stroke-dasharray="0.1 9" opacity="0.85" />
  </g>
  <g fill="currentColor">
    <circle cx="12" cy="21" r="5.5" />
    <circle cx="32" cy="43" r="5.5" />
    <circle cx="52" cy="21" r="5.5" />
  </g>
</svg>
