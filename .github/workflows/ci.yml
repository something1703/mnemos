name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the CockroachDB Cloud cluster version. See ADR-007 — local, CI,
  # and cloud must never drift, or a capability passes in CI and fails in the demo.
  CRDB_VERSION: v26.2.5

jobs:
  invariants:
    # Runs first and alone: if an invariant is broken, nothing else matters.
    name: Sacred invariants (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invariant 1a — no destructive SQL outside the Warden
        run: make no-delete-in-engine
      - name: Invariant 1b — no model dependency inside the Warden
        run: make no-model-in-warden

  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: make lint
      - run: make typecheck

  test:
    name: Tests (CockroachDB ${{ github.workflow }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Must precede every `uv run` below — db/scripts/probe.py and the test
      # suite both need packages/engine's and packages/warden's dependencies
      # (psycopg, boto3, ...), which only the workspace sync installs. This
      # step ran AFTER the probe once; fixed once, guarded here so it cannot
      # silently regress back to that order.
      - run: uv sync --all-packages --group dev

      - name: Start CockroachDB
        # Uses the same compose file developers use, so "works in CI" and
        # "works on my machine" cannot diverge.
        run: make db-local

      - name: Verify cluster capabilities
        # The probe is a test, not a chore: --strict fails this job outright if
        # any CRITICAL capability is missing on the cluster THIS job is running
        # against, which is the property CI actually needs to guard.
        #
        # docs/cluster-capabilities.md itself is a snapshot of the CLOUD
        # cluster (regenerated deliberately, by a developer running
        # `make db-probe` against cloud, and committed on purpose — see
        # ADR-006). It is not diffed here: this job's local Docker cluster
        # legitimately differs from cloud in build arch, current_user, replica
        # count, and default gc.ttlseconds even when every capability the
        # design depends on is identically supported, so a byte-diff against
        # that file can never pass here regardless of real drift.
        run: |
          uv run python db/scripts/probe.py \
            --url 'postgresql://root@localhost:26257/defaultdb?sslmode=disable' \
            --strict
          git checkout -- docs/cluster-capabilities.md

      - name: Apply migrations
        run: make db-migrate
        env:
          MNEMOS_DB_URL: postgresql://root@localhost:26257/mnemos?sslmode=disable

      - name: Seed
        # tests/security/test_rls_isolation.py depends on the CLINIC/OPS/
        # FINANCE tenant rows this creates (its own module docstring says so).
        # Every earlier local run of this suite "passed" only because this
        # developer's machine had leftover tenant rows from unrelated manual
        # seed.py runs earlier in the session — masking that CI never ran
        # this step at all. First run against a genuinely fresh, unseeded
        # cluster is what surfaced it.
        run: make db-seed
        env:
          MNEMOS_DB_URL: postgresql://root@localhost:26257/mnemos?sslmode=disable

      - run: make cov
        env:
          MNEMOS_DB_URL_LOCAL: postgresql://root@localhost:26257/mnemos?sslmode=disable

  redteam:
    name: Red team regression subset
    runs-on: ubuntu-latest
    # Phase 10 populates this. Until then the directory is empty and the job
    # is a no-op that keeps the slot visible in every PR.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: make db-local
      - name: Apply migrations
        run: make db-migrate
        env:
          MNEMOS_DB_URL: postgresql://root@localhost:26257/mnemos?sslmode=disable
      - run: |
          if [ -n "$(find redteam -name 'test_*.py' 2>/dev/null)" ]; then
            make redteam-ci
          else
            echo "redteam/ is empty — populated in Phase 10"
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks must see the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
