[project]
name = "mnemos"
version = "0.1.0"
description = "Accountable memory for agents — governed, jurisdictional, provenance-complete, poison-resistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.uv.workspace]
members = [
    "packages/engine",
    "packages/warden",
    "services/api",
    "services/sleep-cycle",
    "services/custodian",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psycopg2",
    "boto3-stubs[kms,s3]>=1.35",
    "types-pyyaml",
    # FastAPI's own recommended way to test routes in-process, no server
    # socket needed. Test-only: services/api's own runtime dependencies
    # don't need it.
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "services", "db", "demos", "redteam", "bench", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "A",             # builtins shadowing
    "C4",            # comprehensions
    "DTZ",           # naive datetimes — memory is timestamped; tz bugs are correctness bugs
    "S",             # bandit security rules
    "ASYNC",         # async gotchas
    "RUF",
]
ignore = [
    "S101",  # assert — used deliberately in tests and startup self-checks
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DTZ"]
"redteam/**" = ["S"]  # the attack suite is supposed to look like this
# The homoglyph payload is made of Cyrillic and Greek lookalikes on purpose —
# RUF001/2/3 flagging them as "ambiguous" is the linter correctly identifying
# the attack. Scoped to the corpus file so the rule keeps firing everywhere
# a confusable would be an accident rather than a test case.
"redteam/poison/payloads.py" = ["RUF001", "RUF002", "RUF003"]
# The probe interpolates one module-level constant (SCRATCH_SCHEMA) into static
# DDL. No user input reaches these strings. This exemption is scoped to the one
# file that needs it rather than relaxed globally — S608 must keep firing
# everywhere real queries are built.
"db/scripts/probe.py" = ["S608"]
# Error-suffix naming reads worse for these: `raise LegalHoldActive(...)` and
# `except OutsideTemporalWindow` are sentences. Every one subclasses MnemosError,
# so the suffix convention is satisfied at the root of the hierarchy.
"packages/engine/src/mnemos_engine/errors.py" = ["N818"]
"packages/engine/src/mnemos_engine/crypto.py" = ["N818"]
"packages/warden/src/mnemos_warden/errors.py" = ["N818"]
"packages/warden/src/mnemos_warden/guarantees.py" = ["N818"]
"packages/warden/src/mnemos_warden/attestation.py" = ["N818"]
# Embedded CSS/JS for the self-verifying HTML deposition export. Line length
# is a Python-source convention; wrapping the JavaScript to 100 columns would
# only make it harder to read as JavaScript.
"services/api/src/mnemos_api/deposition_html.py" = ["E501"]
# `raise ReadOnlyGuaranteeViolated(...)` and `except ToolNotAllowlisted` read
# as sentences; both subclass Exception directly, same reasoning as the
# other N818 exemptions above.
"services/custodian/src/mnemos_custodian/mcp_client.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
# packages/ carries the invariants; it gets the strictest treatment.
files = ["packages", "services", "db", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*", "demos.*", "redteam.*", "bench.*"]
strict = false

# The MCP SDK's @server.tool() decorator is untyped, so mypy treats every tool
# it wraps as untyped too. That is a third-party typing gap, not a gap in our
# code — the tool bodies themselves are fully annotated and still checked.
# Scoped to this one module so the rule keeps biting everywhere else.
[[tool.mypy.overrides]]
module = ["mnemos_api.tools"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tests", "redteam"]
markers = [
    "invariant: proves one of the five sacred invariants (see AGENTS.md)",
    "cloud: requires a live CockroachDB Cloud cluster",
    "rig: requires the 9-node multi-region rig (make db-multiregion)",
    "aws: requires live AWS credentials",
    "security: adversarial isolation and attack-surface tests",
    "slow: excluded from the default PR run",
    "llm: calls a real model API and spends real money — run explicitly, not on every PR",
    "redteam: an attack from the Phase 10 suite (redteam/), run against redteam-* tenants",
]

[tool.coverage.report]
# packages/engine and packages/warden are held to 90% by CI; see Makefile.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
