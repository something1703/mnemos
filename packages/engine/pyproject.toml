[project]
name = "mnemos-engine"
version = "0.1.0"
description = "The Fabric: remember, recall, recall_as_of, explain, blast_radius. Reads and writes memory — never destroys it."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "cryptography>=44.0",
]

[project.scripts]
mnemos-verify = "mnemos_engine.ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_engine"]
