[project]
name = "mnemos-warden"
version = "0.1.0"
description = "The Warden: residency, legal hold, erasure, revocation, attestation. The only component that may destroy — and it contains no model."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# INVARIANT 1 LIVES HERE.
#
# This dependency list must never gain an LLM client — no anthropic, no openai,
# no langchain, no boto3 bedrock runtime. `make no-model-in-warden` greps for
# them and CI checks the transitive import graph (Phase 06.1). boto3 is present
# for KMS and S3 Object Lock only; the Warden's IAM role carries an explicit
# Deny on bedrock:InvokeModel, so even a smuggled import could not call a model.
dependencies = [
    "mnemos-engine",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "boto3>=1.35",
]

[project.scripts]
mnemos-attest = "mnemos_warden.attestation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_warden"]

[tool.uv.sources]
mnemos-engine = { workspace = true }
