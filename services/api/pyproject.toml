[project]
name = "mnemos-api"
version = "0.1.0"
description = "Mnemos MCP server + REST facade. Validates admin operations, then hands them to the Warden across an IAM boundary."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# On depending on mnemos-warden (this was NOT the original plan — see below).
#
# PHASE_04 sketched an API that never imports the Warden and instead invokes it
# as a separate Lambda across an IAM boundary. That remains the deployment
# target (Phase 04.4), and it is the stronger form.
#
# In-process today, the separation is enforced at the DATABASE layer instead:
# the API's own pool connects as a role with no DELETE grant anywhere
# (mnemos_api, migration 011), and Warden operations use a second pool bound to
# a privileged role. An admin scope check gates the second pool before it is
# ever touched. If both DSNs are identical the separation is inactive, and the
# service says so at startup and in memory_stats rather than pretending.
#
# Recording this here because a comment claiming "does NOT depend on
# mnemos-warden" while runtime.py imports it would be worse than the coupling.
dependencies = [
    "mnemos-engine",
    "mnemos-warden",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=2.0",
    "pydantic>=2.9",
    # Lambda adapter. Pure Python, so nothing extra to install into the image.
    "mangum>=0.19",
    # Already a transitive dep via mnemos-warden (S3 Object Lock, KMS); named
    # explicitly because runtime.py imports it directly too, to presign a
    # deposition's anchor URL — depending on something only implicitly would
    # be the kind of coupling this project's own pyproject comments warn about.
    "boto3>=1.35",
]

[project.scripts]
mnemos-api = "mnemos_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_api"]

[tool.uv.sources]
mnemos-engine = { workspace = true }
mnemos-warden = { workspace = true }
