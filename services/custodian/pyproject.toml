[project]
name = "mnemos-custodian"
version = "0.1.0"
description = "The self-maintaining agent: official CockroachDB Agent Skills over the Cloud MCP Server and ccloud, filed back into memory."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mnemos-engine",
    "mcp>=1.1",
    "boto3>=1.35",
    "pydantic>=2.9",
]

# The Custodian is the one component that IS an LLM agent, and therefore the one
# with the least privilege: a write-scoped API key, read-only MCP access
# asserted at startup, and an allowlist of SQL extracted from the official
# skills' references/ files. It may propose governance actions; it may never
# execute one (Phase 07.4).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_custodian"]

[tool.uv.sources]
mnemos-engine = { workspace = true }
